[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-release-notes"
version = "0.1.0"
description = "Render Markdown release notes from a local pull request export"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4", "ruff>=0.11"]

[project.scripts]
markdown-release-notes = "markdown_release_notes.cli:main"

[tool.setuptools]
packages = ["markdown_release_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
